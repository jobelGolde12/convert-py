[project]
name = "convert-py"
version = "0.1.0"
description = "Convert — document conversion platform (Python migration)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "jinja2>=3.1.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "redis>=5.0.8",
  "celery>=5.4.0",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.2.1",
  "python-multipart>=0.0.9",
  "aiofiles>=23.3.1",
  "sse-starlette>=2.0.0",
  "pypdf>=4.2.0",
  "pillow>=10.3.0",
  "reportlab>=4.2.0",
  "pypandoc>=1.13",
  "boto3>=1.34.129",
  "python-dotenv>=1.0.1",
  "slowapi>=0.2.4",
  "limits>=3.11.0",
  "tenacity>=9.0.0",
  "alembic-postgresql-enum",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "httpx>=0.27.0",
  "ruff>=0.4.4",
  "mypy>=1.10.0",
  "playwright>=1.43.0",
  "types-passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# tests/conftest.py sets env vars before importing app modules (intentional E402)
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true